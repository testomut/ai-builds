# Runs the tests on every push. Needs no keys and uses no paid APIs.
name: seo-serp-mvp tests

on:
  push:
    paths: ["seo-serp-mvp/**", ".github/workflows/seo-serp-mvp-tests.yml"]
  pull_request:
    paths: ["seo-serp-mvp/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seo-serp-mvp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pytest -v
